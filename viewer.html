<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>پیوست — جیمیل‌بین</title>
  <style>
    :root { --bg:#fff; --text:#1f2328; --muted:#69707a; --border:#e3e6ea; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1c1d20; --text:#e8eaed; --muted:#9aa0a6; --border:#34373c; } }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px Vazirmatn,"Segoe UI",Tahoma,sans-serif; }
    body { display:flex; flex-direction:column; }
    #msg { margin:auto; color:var(--muted); }
    iframe { flex:1; width:100%; border:0; }
    .img { flex:1; overflow:auto; display:grid; place-items:center; background:#202124; }
    .img img { max-width:100%; }
  </style>
</head>
<body>
  <div id="msg">در حال دریافت پیوست…</div>
  <script src="viewer.js"></script>
</body>
</html>
