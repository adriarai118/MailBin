<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>تنظیمات جیمیل‌بین</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --border:#e3e6ea; --text:#1f2328; --muted:#69707a; --accent:#d93025; }
    @media (prefers-color-scheme: dark) { :root { --bg:#151618; --card:#1f2124; --border:#34373c; --text:#e8eaed; --muted:#9aa0a6; --accent:#f28b82; } }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.7 Vazirmatn,"Segoe UI",Tahoma,sans-serif; }
    .wrap { max-width:560px; margin:40px auto; padding:0 16px; }
    h1 { font-size:20px; margin:0 0 4px; }
    p.sub { color:var(--muted); margin:0 0 20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:4px 18px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--border); }
    .row:last-child { border-bottom:0; }
    .row small { display:block; color:var(--muted); font-size:12px; }
    select, input[type=text], input[type=number] { font:inherit; padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); min-width:140px; }
    input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); }
    .saved { color:var(--accent); font-size:13px; margin-top:12px; min-height:20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>تنظیمات جیمیل‌بین</h1>
    <p class="sub">تغییرات خودکار ذخیره می‌شوند.</p>
    <div class="card">
      <div class="row">
        <label for="interval">فاصله بررسی<small>هر چند وقت یک‌بار ایمیل‌ها چک شوند</small></label>
        <select id="interval">
          <option value="0.5">۳۰ ثانیه</option>
          <option value="1">۱ دقیقه</option>
          <option value="2">۲ دقیقه</option>
          <option value="5">۵ دقیقه</option>
          <option value="10">۱۰ دقیقه</option>
          <option value="30">۳۰ دقیقه</option>
        </select>
      </div>
      <div class="row">
        <label for="notify">اعلان ایمیل جدید<small>نمایش پیام ویندوز هنگام رسیدن ایمیل</small></label>
        <input type="checkbox" id="notify">
      </div>
      <div class="row">
        <label for="maxAccounts">حداکثر تعداد حساب<small>حساب‌هایی که در کروم وارد شده‌اند (u/0، u/1، …)</small></label>
        <input type="number" id="maxAccounts" min="1" max="10">
      </div>
      <div class="row">
        <label for="scope">شمارش ایمیل‌ها<small>جیمیل در تب «اصلی» فقط ایمیل‌های Primary را می‌شمارد</small></label>
        <select id="scope">
          <option value="inbox">کل صندوق ورودی (همه تب‌ها)</option>
          <option value="primary">فقط تب اصلی (Primary)</option>
        </select>
      </div>
      <div class="row">
        <label for="markOnOpen">خوانده‌شده با باز کردن<small>وقتی ایمیل را در پاپ‌آپ باز می‌کنید، در جیمیل هم خوانده‌شده شود</small></label>
        <input type="checkbox" id="markOnOpen">
      </div>
      <div class="row">
        <label for="label">برچسب (Label)<small>اگر پر شود، به‌جای گزینه بالا استفاده می‌شود. مثلاً: important یا نام برچسب خودتان</small></label>
        <input type="text" id="label" dir="ltr" placeholder="inbox">
      </div>
    </div>
    <div class="saved" id="saved"></div>
    <p class="sub"><a href="update.html" style="color:var(--accent)">آپدیت از GitHub ←</a></p>
  </div>
  <script src="options.js"></script>
</body>
</html>
